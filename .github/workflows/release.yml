name: Build and publish release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows x64 executable
        run: >-
          dotnet publish .\Data\KH1ARDViewer.csproj
          -c Release
          -r win-x64
          --no-self-contained
          -p:SelfContained=false
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\_publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KH1-ARD-Viewer-win-x64
          path: .\_publish\KH1 ARD Viewer.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: KH1 ARD Viewer ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          files: .\_publish\KH1 ARD Viewer.exe
