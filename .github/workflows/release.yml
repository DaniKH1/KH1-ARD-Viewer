name: Release Manual Executable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version. Leave empty to use v<today''s date>, for example v2026.11.3'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: exe-release
  cancel-in-progress: true

jobs:
  build:
    name: Manual Windows Build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate requested tag
        if: ${{ inputs.tag != '' }}
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = "$env:INPUT_TAG".Trim()
          if (-not $tag.StartsWith('v')) {
            throw "The release tag must start with 'v', for example v1.0.0. Received: $tag"
          }
          git check-ref-format "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "The release tag is not a valid Git tag: $tag"
          }

      - name: Build
        run: >-
          dotnet publish .\Data\KH1ARDViewer.csproj
          -c Release
          -r win-x64
          --no-self-contained
          -p:SelfContained=false
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\_publish

      - name: Check executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD '_publish\KH1 ARD Viewer.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw 'The build did not produce KH1 ARD Viewer.exe.'
          }
          $size = (Get-Item -LiteralPath $exe).Length
          if ($size -lt 100KB) {
            throw "The executable is unexpectedly small ($size bytes)."
          }
          Write-Host "Executable ready: $([math]::Round($size / 1MB, 2)) MB"

      - uses: actions/upload-artifact@v7
        with:
          name: KH1-ARD-Viewer
          path: '_publish/KH1 ARD Viewer.exe'
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: KH1-ARD-Viewer
          path: exe

      - name: Choose release tag
        id: tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = "$env:INPUT_TAG".Trim()
          if (-not $tag) {
            $tag = "v$(Get-Date -Format 'yyyy.M.d')"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing as $tag"

      - name: Publish release
        id: publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: 'exe/KH1 ARD Viewer.exe'
          generate_release_notes: true
